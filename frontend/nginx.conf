server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DNS interno de Docker: resuelve "backend" en cada petición, así nginx arranca aunque
    # el backend aún no esté listo y sigue funcionando si el contenedor se recrea
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    # El API lo sirve el contenedor backend (mismo origen para el navegador: sin CORS)
    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Ficheros con hash en el nombre: se pueden cachear indefinidamente
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
